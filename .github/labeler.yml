# Configuration for .github/workflows/labeler.yaml (https://github.com/actions/labeler).
#
# Labels are only ever added, never removed. The labels that satisfy the release-notes check
# (`release-notes:not-required` and `category:internal`) are deliberately never applied here: whether
# a change needs release notes is a human decision, and an added label would stay even if later
# pushes made the PR user-facing.

# If a PR would gain more than this many labels from the rules below, it gains none of them. This
# keeps tree-wide refactors from collecting a label for every backend they happen to touch.
changed-files-labels-limit: 3

"backend: Adhoc":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/adhoc/**
          - src/python/pants/backend/experimental/adhoc/**

"backend: CC":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/cc/**
          - src/python/pants/backend/experimental/cc/**

"backend: Docker":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/docker/**
          - src/python/pants/backend/experimental/docker/**

"backend: Environments":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/core/environments/**

"backend: Go":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/go/**
          - src/python/pants/backend/experimental/go/**

"backend: Helm":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/helm/**
          - src/python/pants/backend/experimental/helm/**

"backend: JavaScript":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/javascript/**
          - src/python/pants/backend/typescript/**
          - src/python/pants/backend/jsx/**
          - src/python/pants/backend/tsx/**
          - src/python/pants/backend/experimental/javascript/**
          - src/python/pants/backend/experimental/typescript/**

"backend: JVM":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/jvm/**
          - src/python/pants/backend/java/**
          - src/python/pants/backend/kotlin/**
          - src/python/pants/backend/scala/**
          - src/python/pants/backend/experimental/java/**
          - src/python/pants/backend/experimental/kotlin/**
          - src/python/pants/backend/experimental/scala/**

"backend: OpenAPI":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/openapi/**
          - src/python/pants/backend/experimental/openapi/**

"backend: Protobuf":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/codegen/protobuf/**
          - src/python/pants/backend/experimental/codegen/protobuf/**

"backend: Python":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/python/**
          - src/python/pants/backend/experimental/python/**

"backend: Rust":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/rust/**
          - src/python/pants/backend/experimental/rust/**

"backend: Shell":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/shell/**

"backend: Swift":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/swift/**
          - src/python/pants/backend/experimental/swift/**

"backend: Terraform":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/terraform/**
          - src/python/pants/backend/experimental/terraform/**

"backend: Thrift":
  - changed-files:
      - any-glob-to-any-file:
          - src/python/pants/backend/codegen/thrift/**
          - src/python/pants/backend/experimental/codegen/thrift/**

# Only when every changed file is user-facing documentation (release notes do not count).
"category:documentation":
  - changed-files:
      - all-globs-to-all-files:
          - "docs/docs/**"
