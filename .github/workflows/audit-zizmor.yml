name: Scheduled zizmor audit
on:
  schedule:
  - cron: 21 8 * * *  # 8:21am
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  zizmor-audit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        sparse-checkout: |
            .
            .github

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@v0.5.3
