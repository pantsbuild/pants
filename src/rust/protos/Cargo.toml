[package]
version = "0.0.1"
edition = "2024"
name = "protos"
authors = ["Pants Build <pantsbuild@gmail.com>"]
publish = false

[dependencies]
hashing = { path = "../hashing" }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true, features = ["transport", "codegen", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
tonic-prost-build = { workspace = true }

[lints]
# This section is included so that the `cargo::missing_lints_inheritance` lint is not triggered.
# This crate intentionally does not inherit the workspace lint settings because most of the code
# in this crate is auto-generated by Prost.